name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fall back to the origin on any proxy error, not only on 404/410.
      GOPROXY: https://proxy.golang.org|direct
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/ori/go.mod
          cache-dependency-path: plugins/ori/go.sum

      - name: Download Go modules
        working-directory: plugins/ori
        shell: bash
        run: |
          # The module proxy occasionally resets streams; retry before the suite.
          for attempt in 1 2 3; do
            go mod download && exit 0
            sleep $((attempt * 10))
          done
          exit 1

      - name: Validate Claude Code marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .
          npx -y @anthropic-ai/claude-code plugin validate --strict plugins/todo-claude

      - name: Run tests
        run: make test

  todo-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test native Windows ToDo lifecycle
        run: npm run test:windows
